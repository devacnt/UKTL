name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Regression tests
        run: npm run test:unit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Workers bundle)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7


  postgres-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated local Supabase (database, storage, auth) and replay migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      - name: Staff authorization and ownership regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/staff_access.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Actual PostgreSQL discovery queries
        run: node scripts/test-discovery-postgres.ts
      - name: CV leases, revisions and retry regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/cv_processing.sql
      - name: Actual CV worker PostgreSQL integration
        run: node scripts/test-processing-postgres.ts
      - name: Actual Reed vacancy PostgreSQL integration
        run: node scripts/test-reed-postgres.ts
      - name: Reed sync leases and role restrictions
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/reed_sync.sql
      - name: Actual resumable Reed worker
        run: node scripts/test-reed-resume-postgres.ts
      - name: HR journeys and verified booking PostgreSQL integration
        run: node scripts/test-hr-postgres.ts
      - name: Actual Storage media upload verification
        run: |
          eval "$(supabase status -o env)"
          TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-media-postgres.ts
      - name: Mandate duration, ranking, fill and reopen
        run: node scripts/test-jobs-postgres.ts
      - name: Outreach log, CSV export and chart queries
        run: node scripts/test-admin-tools-postgres.ts
      - name: Privacy erasure, audit attribution and AI budget policies
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/operations.sql
      - name: Stop isolated database
        if: always()
        run: supabase stop --no-backup
