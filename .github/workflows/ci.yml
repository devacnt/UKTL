name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Regression tests
        run: npm run test:unit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Workers bundle)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium firefox webkit msedge

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Mobile Lighthouse evidence (local build, not deployed acceptance)
        run: |
          npx vite dev --port 5173 --host 127.0.0.1 > /tmp/uktl-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())")"
          npx --yes lighthouse@13.5.0 http://127.0.0.1:5173/ --chrome-flags="--headless --no-sandbox" --output=json --output=html --output-path=./lighthouse-mobile --quiet
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('lighthouse-mobile.report.json','utf8')); console.log('LIGHTHOUSE_LOCAL_MOBILE',JSON.stringify(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score]))));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile
          path: lighthouse-mobile.*
          retention-days: 14


  postgres-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Enable Google/Apple sign-in on the isolated Auth server (dummy client ids)
        run: |
          python3 - <<'PY'
          import re
          p = "supabase/config.toml"
          s = open(p).read()
          s = re.sub(r"(\[auth\.external\.(google|apple)\]\n)enabled = false", r"\1enabled = true", s)
          open(p, "w").write(s)
          PY
      - name: Start isolated local Supabase (database, storage, auth) and replay migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: local-test.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: local-test-secret
          SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID: uk.local.test
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: local-test-secret
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      - name: Staff authorization and ownership regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/staff_access.sql
      - name: Phase 1 employer isolation and CV version history
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/phase_one.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Actual PostgreSQL discovery queries
        run: node scripts/test-discovery-postgres.ts
      - name: CV leases, revisions and retry regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/cv_processing.sql
      - name: Actual CV worker PostgreSQL integration
        run: node scripts/test-processing-postgres.ts
      - name: Actual Reed vacancy PostgreSQL integration
        run: node scripts/test-reed-postgres.ts
      - name: Reed sync leases and role restrictions
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/reed_sync.sql
      - name: Actual resumable Reed worker
        run: node scripts/test-reed-resume-postgres.ts
      - name: HR journeys and verified booking PostgreSQL integration
        run: node scripts/test-hr-postgres.ts
      - name: Actual Storage media upload verification
        run: |
          eval "$(supabase status -o env)"
          TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-media-postgres.ts
      - name: Google/Apple PKCE sign-in against the real Auth server
        run: |
          eval "$(supabase status -o env)"
          TEST_SUPABASE_ANON_KEY="$ANON_KEY" TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/test-oauth-supabase.ts
      - name: HTTPS data bridge (the path Lovable/Cloudflare Workers uses)
        run: |
          eval "$(supabase status -o env)"
          TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" TEST_SUPABASE_ANON_KEY="$ANON_KEY" node scripts/test-https-bridge.ts
      - name: Mandate duration, ranking, fill and reopen
        run: node scripts/test-jobs-postgres.ts
      - name: Inbox, campaign consent, reminders and calendar synchronization
        run: node scripts/test-communications-postgres.ts
      - name: Outreach log, CSV export and chart queries
        run: node scripts/test-admin-tools-postgres.ts
      - name: Privacy erasure, audit attribution and AI budget policies
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/operations.sql
      - name: Stop isolated database
        if: always()
        run: supabase stop --no-backup
